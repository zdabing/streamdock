[workspace]
members = ["crates/core", "crates/server", "crates/cli"]
resolver = "2"

[workspace.package]
version = "1.16.2"
edition = "2024"
license = "MIT"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt", "io"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots", "stream", "json", "charset"] }
http = "1"
url = "2"
bytes = "1"
flate2 = "1"
brotli = "7"
axum = { version = "0.8", features = ["ws", "json", "query", "tokio", "http1"] }
tower-http = { version = "0.6", features = ["limit"] }
mime_guess = "2"
rust-embed = "8"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
md-5 = "0.10"
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
unicode-normalization = "0.1"
regex = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
clap = { version = "4", features = ["derive"] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "6"
tempfile = "3"
tokio-tungstenite = "0.26"
